name: CI-CD Pipeline

on:
  push:
    branches: [ main ]    # runs when you push to main

jobs:

  # JOB 1: Run tests
  # If tests fail → nothing deploys
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4     # downloads your code

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Tests
        run: pytest                   # runs test_app.py automatically


  # JOB 2: Build Docker image and push to DockerHub
  # Only runs if tests pass (needs: test)
  build-and-push:
    runs-on: ubuntu-latest
    needs: test                       # waits for test job to pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
        # secrets stored in GitHub → Settings → Secrets

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/ci-cd-demo:latest .

      - name: Push to DockerHub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/ci-cd-demo:latest


  # JOB 3: Deploy to Render
  # Render auto deploys when DockerHub image updates
  # OR you can trigger via Render deploy hook
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push             # waits for image to be pushed

    steps:
      - name: Trigger Render Deploy
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
          